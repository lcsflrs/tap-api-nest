services:
  api:
    container_name: tap-backoffice-api
    build:
      context: .
      dockerfile: Dockerfile
    command: bun dev
    ports:
      - "5001:5001"
    volumes:
      - .:/usr/app
      - /usr/app/node_modules
    env_file:
      - .env
    networks:
      - web

networks:
  web:
    external: true
