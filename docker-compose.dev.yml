services:
  api:
    container_name: tap-api-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        - DB_URL=${DB_URL}
    working_dir: /usr/app
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - .:/usr/app
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
    restart: no

  db:
    container_name: tap-mysql-dev
    image: mysql:8.0
    env_file:
      - .env.dev
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-dev:/var/lib/mysql
    networks:
      - web
    restart: no
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

networks:
  web:

volumes:
  mysql-data-dev:
